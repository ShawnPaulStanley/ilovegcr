<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iloveGCR</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="header-icon">
      <img src="image.png" alt="iloveGCR">
    </div>
    <div class="header-text">
      <h1>iloveGCR</h1>
      <span>Classroom Attachment Downloader</span>
    </div>
  </div>

  <div id="status" class="status">Checking for attachments...</div>

  <div class="content" id="content">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="loading-text">Scanning page for files...</div>
    </div>

    <div id="fileListContainer" style="display: none;">
      <div class="select-actions">
        <button id="selectAll" type="button">
          Select All
        </button>
        <button id="deselectAll" type="button">
          Deselect All
        </button>
      </div>

      <div class="file-list-wrapper">
        <div class="file-list" id="fileList"></div>
      </div>

      <div class="actions">
        <button class="btn btn-secondary" id="refreshBtn" type="button">Refresh Page</button>
        <button class="btn btn-primary" id="downloadBtn" type="button">Download Selected</button>
      </div>

      <div class="settings">
        <div class="settings-title">Download Path</div>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="downloadPath" placeholder="e.g., Downloads/Classroom">
          <button id="savePathBtn" type="button">Save</button>
        </div>
        <div id="pathStatus" class="path-status"></div>
      </div>
    </div>

    <div id="emptyState" class="empty-state" style="display: none;">
      <div class="icon-wrapper">
        <svg viewBox="0 0 256 256"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm-8-80V80a8,8,0,0,1,16,0v56a8,8,0,0,1-16,0Zm20,36a12,12,0,1,1-12-12A12,12,0,0,1,140,172Z"/></svg>
      </div>
      <div class="title">No downloadable files found</div>
      <div class="subtitle">Open a Classroom assignment or material page<br>with attachments to download</div>
    </div>

    <div id="notClassroom" class="empty-state" style="display: none;">
      <div class="icon-wrapper">
        <svg viewBox="0 0 256 256"><path d="M213.66,82.34l-56-56A8,8,0,0,0,152,24H56A16,16,0,0,0,40,40V216a16,16,0,0,0,16,16H200a16,16,0,0,0,16-16V88A8,8,0,0,0,213.66,82.34ZM160,51.31,188.69,80H160ZM200,216H56V40h88V88a8,8,0,0,0,8,8h48V216Zm-40-64a8,8,0,0,1-8,8H104a8,8,0,0,1,0-16h48A8,8,0,0,1,160,152Zm0,32a8,8,0,0,1-8,8H104a8,8,0,0,1,0-16h48A8,8,0,0,1,160,184Z"/></svg>
      </div>
      <div class="title">Not a Classroom page</div>
      <div class="subtitle">Navigate to Google Classroom<br>to use this extension</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
